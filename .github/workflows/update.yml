name: Track cars

on:
  schedule:
    - cron: "20 11 * * *"       # about 5:20 am Central
    - cron: "20 23 * * *"       # about 5:20 pm Central: catch same-day price changes
  workflow_dispatch:
  push:                         # a change to the page republishes it; a change to the code or the dealers rebuilds
    branches: [main]
    paths: ["site/**", "cartrack/**", "build.py", "dealers.json", "sources.json", ".github/workflows/update.yml", ".github/scripts/**"]

permissions:
  contents: write               # to replace the data branch
  pages: write                  # to publish the site
  id-token: write               # required by the Pages deploy action

concurrency:                    # one run at a time, so two never race on the data branch
  group: tracking
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.redeploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run the tests
        run: |
          python -m unittest discover -s tests -t .
          node --test tests/js/*.test.mjs

      - name: Get the latest data
        run: bash .github/scripts/data-branch.sh load || echo "starting a new catalogue"

      # A dealer whose read fails keeps what the catalogue knew; build.py fails this step only when every
      # dealer failed, and then the data branch and the page are left as they were.
      - name: Read the dealers and update the catalogue
        run: python build.py
        env:
          CAPTURES_TOKEN: ${{ secrets.CAPTURES_TOKEN }}     # only needed while the captures repository is private

      - name: Save the data
        run: bash .github/scripts/data-branch.sh save

      # Pages must already be on with "GitHub Actions" as its source (Settings, Pages): a workflow's own
      # token is not allowed to turn it on.
      - uses: actions/configure-pages@v5

      # The bundle is named for the attempt: pressing "Re-run" on a failed run uploads again, and the deploy
      # refuses a run that holds two bundles of the same name (seen 2026-11-21).
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}

      # The deploy asks GitHub for the bundle just uploaded, and the listing can lag the upload: on 2026-11-21 it
      # asked 0.27 seconds after the upload finished and was told there was none. So wait first, and if it still
      # fails, wait longer and try once more.
      - name: Give the uploaded page a moment to be listed
        run: sleep 15

      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Wait before a second try
        if: steps.deploy.outcome == 'failure'
        run: sleep 60

      - id: redeploy
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
